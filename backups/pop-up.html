{% for guide in visa_guides %}
  {% if guide.id %}
    <div class="alert alert-warning text-center alert-dismissible fade show" role="alert">
      🚀 Unlock Visa Guidelines for Your Destination!
      <a href="{% url 'seeker:unlock_visa_guide' guide.id %}" class="btn btn-sm btn-primary ms-2">Unlock Now</a>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% else %}
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      Visa Guide ID missing! Please contact support.
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endif %}
{% endfor %}
