{% if jobs %}
  <div class="row g-4">
    {% for job in jobs %}
      <div class="col-md-6 col-lg-4" data-job-id="{{ job.id }}">
        <div class="card h-100 border-0 shadow-sm rounded-4 hover-shadow">
          <div class="card-body d-flex flex-column p-4">
            <!-- Job Title -->
            <h5 class="card-title mb-2">
              <a href="{% url 'jobs:job_detail' job.id %}" class="text-decoration-none text-primary fw-semibold">
                {{ job.title }}
              </a>
            </h5>

            <!-- Company -->
            <p class="text-muted small mb-1">
              <i class="bi bi-building me-1 text-secondary"></i>
              <strong>Company:</strong> {{ job.company_name }}
            </p>

            <!-- Salary -->
            <p class="text-muted small mb-1">
              <i class="bi bi-cash me-1 text-success"></i>
              <strong>Salary:</strong> {{ job.salary }}
            </p>

            <!-- Deadline -->
            <p class="text-muted small mb-1">
              <i class="bi bi-calendar-event me-1 text-warning"></i>
              <strong>Deadline:</strong> {{ job.deadline|date:"F j, Y" }}
            </p>

            <!-- Location -->
            <p class="text-muted small mb-3">
              <i class="bi bi-geo-alt me-1 text-info"></i>
              <strong>Location:</strong> {{ job.country.name }}
            </p>

            <!-- Call to Action -->
            <a href="{% url 'jobs:job_detail' job.slug %}" class="btn btn-outline-primary btn-sm rounded-pill mt-auto align-self-start">
              View Job
            </a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="alert alert-warning text-center mt-4 fw-semibold rounded-3 shadow-sm">
    ❌ No Jobs Found! Try refining your search or filters.
  </div>
{% endif %}
