<style>
  /* Flickering flame animation for HOT badge */
  @keyframes flicker {
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
      opacity: 1;
      text-shadow:
        0 0 4px #ffbb00,
        0 0 11px #ffbb00,
        0 0 19px #ffbb00,
        0 0 40px #ffa500;
    }
    20%, 22%, 24%, 55% {
      opacity: 0.7;
      text-shadow: none;
    }
  }
  .hot-badge {
    font-size: 0.75rem;
    color: #ffc107;
    background-color: #fff3cd;
    padding: 0.15rem 0.5rem;
    border-radius: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    animation: flicker 1.5s infinite;
    position: absolute;
    top: 1rem;
    right: 1rem;
    box-shadow: 0 0 8px #ffc107;
  }
  .job-card {
    position: relative;
    border-width: 2px !important;
  }
</style>

{% if hot_jobs %}
  <div class="row g-4">
    {% for job in hot_jobs %}
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm border-warning job-card rounded-4">
          <div class="card-body d-flex flex-column position-relative p-4">
            <!-- HOT badge -->
            <span class="hot-badge">🔥 HOT</span>

            <!-- Job Title -->
            <h5 class="card-title text-warning fw-semibold mb-2">
              <a href="{% url 'jobs:job_detail' job.id %}" class="text-decoration-none text-warning">
                {{ job.title }}
              </a>
            </h5>

            <!-- Company -->
            <p class="mb-1 text-muted">
              <i class="bi bi-building me-1"></i>
              <strong>Company:</strong> {{ job.company_name }}
            </p>

            <!-- Salary -->
            <p class="mb-1 text-muted">
              <i class="bi bi-cash me-1"></i>
              <strong>Salary:</strong> {{ job.salary }}
            </p>

            <!-- Views -->
            <p class="mb-1 text-muted">
              <i class="bi bi-eye me-1"></i>
              <strong>Views:</strong> {{ job.views }}
            </p>

            <!-- Location -->
            <p class="mb-3 text-muted">
              <i class="bi bi-geo-alt me-1"></i>
              <strong>Location:</strong> {{ job.country.name }}
            </p>

            <!-- View Job Button -->
            <a href="{% url 'jobs:job_detail' job.id %}" class="btn btn-outline-warning rounded-pill mt-auto px-4 fw-semibold shadow-sm">
              View Job
            </a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="alert alert-warning text-center mt-4 fw-semibold shadow-sm rounded-3">
    ❌ No Hot Jobs Found! Try refining your search or filters.
  </div>
{% endif %}
