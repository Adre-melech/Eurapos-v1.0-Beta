{% if hot_jobs %}
  <div class="row g-4">
    {% for job in hot_jobs %}
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm border border-warning">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">
              <a href="{% url 'jobs:job_detail' job.id %}" class="text-decoration-none text-warning">
                {{ job.title }}
              </a>
            </h5>
            <p class="mb-1 text-muted"><i class="bi bi-building"></i> <strong>Company:</strong> {{ job.company_name }}</p>
            <p class="mb-1 text-muted"><i class="bi bi-cash"></i> <strong>Salary:</strong> {{ job.salary }}</p>
            <p class="mb-1 text-muted"><i class="bi bi-eye"></i> <strong>Views:</strong> {{ job.views }}</p>
            <p class="mb-3 text-muted"><i class="bi bi-geo-alt"></i> <strong>Location:</strong> {{ job.country.name }}</p>
            <a href="{% url 'jobs:job_detail' job.id %}" class="btn btn-outline-warning mt-auto">View Job</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="alert alert-warning text-center mt-4 fw-semibold">
    ❌ No Hot Jobs Found! Try refining your search or filters.
  </div>
{% endif %}
