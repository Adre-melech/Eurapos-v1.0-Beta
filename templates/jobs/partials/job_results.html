{% if jobs %}
  {% for job in jobs %}
    <div class="col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm border">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ job.title }}</h5>
          <p class="text-muted mb-1">{{ job.company_name }}</p>
          <p class="text-muted mb-3 small">
            <i class="bi bi-geo-alt me-1"></i> {{ job.country.name }}<br>
            <i class="bi bi-calendar-event me-1"></i> Deadline: {{ job.deadline|date:"F j, Y" }}
          </p>
          <a href="{% url 'jobs:job_detail' job.id %}" class="btn btn-outline-primary mt-auto">View Job</a>
        </div>
      </div>
    </div>
  {% endfor %}
{% else %}
  <div class="col-12">
    <div class="alert alert-warning text-center">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      No jobs found matching your criteria.
    </div>
  </div>
{% endif %}
