{% if jobs %}
  {% for job in jobs %}
    <div class="col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm border-0 rounded-4">
        <div class="card-body d-flex flex-column p-4">
          <!-- Job Title -->
          <h5 class="card-title mb-1 fw-semibold text-primary">
            <a href="{% url 'jobs:job_detail' job.id %}" class="text-decoration-none text-primary">
              {{ job.title }}
            </a>
          </h5>

          <!-- Company Name -->
          <p class="text-muted small mb-2">
            <i class="bi bi-building me-1"></i>{{ job.company_name }}
          </p>

          <!-- Location and Deadline -->
          <div class="mb-3 small text-muted">
            <div><i class="bi bi-geo-alt me-1"></i>{{ job.country.name }}</div>
            <div><i class="bi bi-calendar-event me-1"></i>Deadline: {{ job.deadline|date:"F j, Y" }}</div>
          </div>

          <!-- View Button -->
          <a href="{% url 'jobs:job_detail' job.id %}" class="btn btn-outline-primary btn-sm rounded-pill mt-auto px-4 shadow-sm">
            View Job
          </a>
        </div>
      </div>
    </div>
  {% endfor %}
{% else %}
  <div class="col-12">
    <div class="alert alert-warning text-center fw-semibold rounded-3 shadow-sm" style="border-left: 5px solid #edcb1c;">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      No jobs found matching your criteria.
    </div>
  </div>
{% endif %}
