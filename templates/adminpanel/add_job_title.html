{% extends "adminpanel/adminbase.html" %}
{% block content %}

<h2>Add Job Title</h2>

<!-- Flash Messages -->
{% if messages %}
<ul>
    {% for message in messages %}
        <li class="alert alert-{{ message.tags }}">{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}

<!-- Add Job Title Form -->
<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Job Title Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Job Category</label>
        <select name="category" class="form-select" required>
            <option value="">Select Category</option>
            {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-success w-100">Add Job Title</button>
</form>

<a href="{% url 'adminpanel:admin_dashboard' %}" class="btn btn-secondary mt-3">Back to Dashboard</a>

{% endblock %}
