{% extends "adminpanel/adminbase.html" %}

{% block content %}
<h2 class="text-center mt-3">Upload New Event</h2>

<!-- Flash Messages -->
{% if messages %}
<div class="alert-container">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}

<!-- Event Upload Form -->
<div class="card p-4 mx-auto" style="max-width: 600px;">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Event Title</label>
            <input type="text" name="title" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Event Image</label>
            <input type="file" name="image" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Credits Required</label>
            <input type="number" name="credits_required" class="form-control" min="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Event Availability Until</label>
            <input type="date" name="available_until" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Event Description</label>
            <textarea name="description" class="form-control rich-text" rows="4" placeholder="Describe the event..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Upload Event</button>
    </form>
</div>

<p class="text-center mt-3">
    <a href="{% url 'adminpanel:admin_dashboard' %}" class="text-secondary">Back to Admin Dashboard</a>
</p>

{% endblock %}
