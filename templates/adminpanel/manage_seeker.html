{% extends "adminpanel/adminbase.html" %}
{% block content %}
<h3 class="mb-4">🛠 Manage Seeker: {{ seeker.username }}</h3>


<form method="POST" class="mb-4">
  {% csrf_token %}
  <input type="hidden" name="update" value="1">

  <div class="row mb-3">
    <div class="col-md-6">
      <label class="form-label">Full Name</label>
      <input type="text" name="full_name" class="form-control" value="{{ seeker.full_name }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" value="{{ seeker.email }}">
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-md-6">
      <label class="form-label">Phone</label>
      <input type="text" name="phone" class="form-control" value="{{ seeker.phone }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Address</label>
      <input type="text" name="address" class="form-control" value="{{ seeker.address }}">
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-md-6">
      <label class="form-label">Country</label>
      <select name="country" class="form-select">
        {% for country in countries %}
          <option value="{{ country.id }}" {% if seeker.country.id == country.id %}selected{% endif %}>
            {{ country.name }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Job Title</label>
      <select name="job_title" class="form-select">
        {% for title in job_titles %}
          <option value="{{ title.id }}" {% if seeker.job_title.id == title.id %}selected{% endif %}>
            {{ title.name }}
          </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="d-flex justify-content-between">
    <button type="submit" class="btn btn-primary">💾 Update Seeker</button>
    <form method="POST" onsubmit="return confirm('Are you sure you want to delete this seeker?');">
      {% csrf_token %}
      <input type="hidden" name="delete" value="1">
      <button type="submit" class="btn btn-danger">🗑 Delete Seeker</button>
    </form>
  </div>
</form>

<a href="{% url 'adminpanel:manage_all_seekers' %}" class="btn btn-secondary">← Back to All Seekers</a>

{% endblock %}
