{% extends "adminpanel/adminbase.html" %}

{% block content %}
<h2 class="text-center mt-3">Edit Event</h2>

<!-- Flash Messages -->
{% if messages %}
<div class="alert-container">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}

<!-- Event Edit Form -->
<div class="card p-4 mx-auto" style="max-width: 600px;">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Event Title</label>
            <input type="text" name="title" class="form-control" value="{{ event.title }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Current Event Image</label><br>
            <img src="{{ event.image.url }}" class="img-fluid mb-2" width="200" alt="Event Image">
            <input type="file" name="image" class="form-control">
            <small class="text-muted">Upload a new image to replace the existing one.</small>
        </div>

        <div class="mb-3">
            <label class="form-label">Credits Required</label>
            <input type="number" name="credits_required" class="form-control" min="1" value="{{ event.credits_required }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Available Until</label>
            <input type="date" name="available_until" class="form-control" value="{{ event.available_until|date:'Y-m-d' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Event Description</label>
            <textarea name="description" class="form-control" rows="4">{{ event.description }}</textarea>
        </div>

        <button type="submit" class="btn btn-warning w-100">Update Event</button>
    </form>
</div>

<p class="text-center mt-3">
    <a href="{% url 'adminpanel:manage_events' %}" class="text-secondary">Back to Manage Events</a>
</p>

{% endblock %}
