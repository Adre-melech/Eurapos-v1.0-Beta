{% extends "adminpanel/adminbase.html" %}
{% block content %}

<h2>Add Job Country</h2>

<!-- Flash Messages -->
{% if messages %}
<ul>
    {% for message in messages %}
        <li class="alert alert-{{ message.tags }}">{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}

<!-- Add Job Country Form -->
<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Country Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success w-100">Add Country</button>
</form>

<a href="{% url 'adminpanel:admin_dashboard' %}" class="btn btn-secondary mt-3">Back to Dashboard</a>

{% endblock %}
