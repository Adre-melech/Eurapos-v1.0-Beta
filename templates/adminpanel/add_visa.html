{% extends "adminpanel/adminbase.html" %}

{% block content %}
<h2 class="text-center mt-3">Upload Visa Guide</h2>

<!-- Flash Messages -->
{% if messages %}
<div class="alert-container">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}

<!-- Visa Guide Upload Form -->
<div class="card p-4 mx-auto" style="max-width: 600px;">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Country</label>
            <input type="text" name="country" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Visa Guide Image</label>
            <input type="file" name="image" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Visa Guide PDF</label>
            <input type="file" name="pdf_file" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Credits Required</label>
            <input type="number" name="credits_required" class="form-control" min="1" value="20" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Upload Visa Guide</button>
    </form>
</div>

<p class="text-center mt-3">
    <a href="{% url 'adminpanel:manage_visa_guides' %}" class="text-secondary">Back to Visa Guides</a>
</p>

{% endblock %}
