{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow-lg border-0 rounded-4 p-4 text-center" style="max-width: 460px; width: 100%;">
    <div class="card-body">
      <div class="mb-3 text-success" style="font-size: 3rem;">
        ✅
      </div>
      <h2 class="mb-3 fw-bold text-success">Password Reset Successful</h2>
      <p class="mb-4 text-muted fs-5">
        You can now log in with your new password.
      </p>
      <a href="{% url 'seeker:seeker_login' %}" class="btn btn-primary btn-lg shadow-sm fw-semibold px-4">
        🔐 Go to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
